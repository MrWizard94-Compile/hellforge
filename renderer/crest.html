<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0} html,body{width:760px;height:340px;overflow:hidden;background:transparent;}
</style></head>
<body>
<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="iron" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.05" numOctaves="4" seed="7" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="3" diffuseConstant="1.2" lighting-color="#6a5848" result="l">
        <feDistantLight azimuth="250" elevation="60"/>
      </feDiffuseLighting>
      <feColorMatrix in="l" type="matrix" values="0.26 0 0 0 0.008  0 0.25 0 0 0.008  0 0 0.26 0 0.010  0 0 0 0 1"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="eyeGlow"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="eye" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff2cf"/><stop offset="35%" stop-color="#ff8c2e"/>
      <stop offset="100%" stop-color="#7a1d07"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb060"/><stop offset="100%" stop-color="#7a1d07"/>
    </linearGradient>
  </defs>

  <!-- symmetric horned crest, built left then mirrored -->
  <g>
    <!-- horns + brow, one side, mirrored via scale -->
    <g id="half">
      <!-- big outer horn sweeping up-out -->
      <path d="M380,150 C300,150 250,120 210,150 C150,190 120,110 150,70 C130,120 175,150 215,132 C260,112 320,132 380,132 Z"
            fill="#0f0a07" filter="url(#iron)"/>
      <!-- horn tip -->
      <path d="M150,70 C138,96 150,120 168,126 C158,104 160,86 150,70 Z" fill="#0a0604"/>
      <!-- inner brow spike -->
      <path d="M380,120 C330,120 300,150 285,190 L305,186 C320,152 345,138 380,138 Z" fill="#0f0a07" filter="url(#iron)"/>
      <!-- ember rim on the horn's top edge -->
      <path d="M380,150 C300,150 250,120 210,150 C170,180 140,120 152,78"
            fill="none" stroke="url(#rim)" stroke-width="2.5" opacity="0.6" filter="url(#glow)"/>
    </g>
    <use href="#half" transform="translate(760,0) scale(-1,1)"/>
  </g>

  <!-- central skull/emblem boss -->
  <g>
    <!-- cranium -->
    <path d="M380,110 C338,110 312,140 312,178 C312,205 330,222 344,236 L336,262 L352,258 L360,278 L380,270
             L400,278 L408,258 L424,262 L416,236 C430,222 448,205 448,178 C448,140 422,110 380,110 Z"
          fill="#0d0806" filter="url(#iron)"/>
    <!-- brow ridge rim -->
    <path d="M330,168 C348,150 412,150 430,168" fill="none" stroke="url(#rim)" stroke-width="2" opacity="0.5" filter="url(#glow)"/>
    <!-- eye sockets, glowing -->
    <ellipse cx="356" cy="188" rx="15" ry="18" fill="#000"/>
    <ellipse cx="404" cy="188" rx="15" ry="18" fill="#000"/>
    <ellipse cx="356" cy="190" rx="9" ry="11" fill="url(#eye)" filter="url(#eyeGlow)"/>
    <ellipse cx="404" cy="190" rx="9" ry="11" fill="url(#eye)" filter="url(#eyeGlow)"/>
    <ellipse cx="356" cy="190" rx="4" ry="6" fill="#fff2cf"/>
    <ellipse cx="404" cy="190" rx="4" ry="6" fill="#fff2cf"/>
    <!-- nasal + jaw hints -->
    <path d="M380,206 L372,226 L380,232 L388,226 Z" fill="#000"/>
    <g stroke="#000" stroke-width="3">
      <line x1="360" y1="250" x2="360" y2="266"/><line x1="372" y1="252" x2="372" y2="270"/>
      <line x1="388" y1="252" x2="388" y2="270"/><line x1="400" y1="250" x2="400" y2="266"/>
    </g>
    <!-- crown spike above skull -->
    <path d="M380,80 L366,116 L394,116 Z" fill="#0f0a07" filter="url(#iron)"/>
    <path d="M380,80 L372,116 L380,116 Z" fill="none" stroke="url(#rim)" stroke-width="1.6" opacity="0.5"/>
  </g>
</svg>
</body></html>
