<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 820px;
        height: 380px;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <svg width="820" height="380" viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- dark forged bone/iron with hammered relief -->
        <filter id="bone" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.028 0.04"
            numOctaves="4"
            seed="9"
            result="n"
          />
          <feDiffuseLighting
            in="n"
            surfaceScale="3.4"
            diffuseConstant="1.25"
            lighting-color="#6a5a48"
            result="l"
          >
            <feDistantLight azimuth="255" elevation="62" />
          </feDiffuseLighting>
          <feColorMatrix
            in="l"
            type="matrix"
            values="0.24 0 0 0 0.01  0 0.22 0 0 0.009  0 0 0.22 0 0.009  0 0 0 0 1"
          />
          <feComposite in2="SourceAlpha" operator="in" />
        </filter>
        <filter id="glow"><feGaussianBlur stdDeviation="4.5" /></filter>
        <filter id="eyeGlow"><feGaussianBlur stdDeviation="7" /></filter>
        <filter id="softGlow"><feGaussianBlur stdDeviation="2" /></filter>
        <radialGradient id="eye" cx="50%" cy="42%" r="62%">
          <stop offset="0%" stop-color="#fff6d8" />
          <stop offset="28%" stop-color="#ffb43a" />
          <stop offset="62%" stop-color="#ff5a12" />
          <stop offset="100%" stop-color="#5a1404" />
        </radialGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffcf8a" />
          <stop offset="55%" stop-color="#ff7a26" />
          <stop offset="100%" stop-color="#7a1d07" />
        </linearGradient>
        <linearGradient id="hornShade" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#241812" />
          <stop offset="100%" stop-color="#080503" />
        </linearGradient>
        <radialGradient id="sigilG" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#fff2cf" />
          <stop offset="45%" stop-color="#ff8c2e" />
          <stop offset="100%" stop-color="rgba(122,29,7,0)" />
        </radialGradient>
      </defs>

      <!-- ambient glow behind the crest -->
      <ellipse
        cx="410"
        cy="205"
        rx="230"
        ry="120"
        fill="rgba(232,69,28,0.16)"
        filter="url(#eyeGlow)"
      />

      <!-- ===== horns: layered, ridged, one side then mirrored ===== -->
      <g>
        <g id="horn">
          <!-- thick horn sweeping out and up to a high curled tip -->
          <path
            d="M388,158
               C322,152 260,140 204,106
               C168,84 146,62 138,42
               C152,60 158,98 198,126
               C254,164 330,168 388,152 Z"
            fill="url(#hornShade)"
            filter="url(#bone)"
          />
          <!-- horn ridges following the curve -->
          <g stroke="#0a0604" stroke-width="2.6" opacity="0.75" fill="none">
            <path d="M244,142 C218,126 200,108 188,88" />
            <path d="M284,150 C260,132 242,112 230,92" />
            <path d="M324,156 C304,140 288,122 278,104" />
          </g>
          <!-- curled dark tip -->
          <path d="M138,42 C134,64 146,86 164,92 C148,74 144,58 138,42 Z" fill="#050302" />
          <!-- ember rim along the horn's upper edge -->
          <path
            d="M388,158 C322,152 260,140 204,106 C166,82 146,60 140,44"
            fill="none"
            stroke="url(#rim)"
            stroke-width="3"
            opacity="0.72"
            filter="url(#glow)"
          />
        </g>
        <use href="#horn" transform="translate(820,0) scale(-1,1)" />
      </g>

      <!-- ===== skull: angular, menacing ===== -->
      <g>
        <!-- cranium + brow (angular) -->
        <path
          d="M410,120
             C368,120 338,146 332,186
             C330,206 338,224 350,240
             L342,250 L356,262 L344,276
             L360,286 L352,306 L380,300 L392,318 L410,308
             L428,318 L440,300 L468,306 L460,286 L476,276
             L464,262 L478,250 L470,240
             C482,224 490,206 488,186
             C482,146 452,120 410,120 Z"
          fill="#0e0a07"
          filter="url(#bone)"
        />
        <!-- furrowed brow ridge -->
        <path
          d="M348,182 C368,160 452,160 472,182"
          fill="none"
          stroke="#050302"
          stroke-width="5"
          opacity="0.9"
        />
        <path
          d="M350,178 C370,158 450,158 470,178"
          fill="none"
          stroke="url(#rim)"
          stroke-width="1.6"
          opacity="0.45"
          filter="url(#softGlow)"
        />
        <!-- angry angled eye sockets -->
        <path d="M356,196 L400,204 L392,232 L360,226 Z" fill="#000" />
        <path d="M464,196 L420,204 L428,232 L460,226 Z" fill="#000" />
        <!-- glowing eyes -->
        <ellipse cx="376" cy="214" rx="13" ry="11" fill="url(#eye)" filter="url(#eyeGlow)" />
        <ellipse cx="444" cy="214" rx="13" ry="11" fill="url(#eye)" filter="url(#eyeGlow)" />
        <ellipse cx="376" cy="214" rx="5" ry="4.5" fill="#fff6e0" />
        <ellipse cx="444" cy="214" rx="5" ry="4.5" fill="#fff6e0" />
        <!-- nasal cavity (angular) -->
        <path d="M410,236 L398,262 L410,270 L422,262 Z" fill="#000" />
        <!-- cheek cracks -->
        <g stroke="#050302" stroke-width="1.6" opacity="0.7" fill="none">
          <path d="M352,248 L366,258 L360,272" />
          <path d="M468,248 L454,258 L460,272" />
        </g>
        <!-- fanged jaw -->
        <g fill="#0a0604">
          <path d="M366,286 L360,312 L372,290 Z" />
          <path d="M384,292 L380,318 L392,296 Z" />
          <path d="M410,296 L406,326 L414,326 L410,296 Z" />
          <path d="M436,292 L440,318 L428,296 Z" />
          <path d="M454,286 L460,312 L448,290 Z" />
        </g>
        <!-- forehead sigil, glowing -->
        <circle cx="410" cy="168" r="16" fill="url(#sigilG)" filter="url(#glow)" />
        <text
          x="410"
          y="176"
          font-family="Georgia, serif"
          font-weight="700"
          font-size="20"
          fill="#fff2cf"
          text-anchor="middle"
          filter="url(#softGlow)"
        >
          &#5808;
        </text>
        <!-- crown spike -->
        <path d="M410,96 L398,132 L422,132 Z" fill="#0e0a07" filter="url(#bone)" />
        <path d="M410,96 L404,132" stroke="url(#rim)" stroke-width="1.6" opacity="0.5" />
      </g>
    </svg>
  </body>
</html>
